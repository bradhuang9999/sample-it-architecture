<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} - WUT1 Citizen</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header border-bottom bg-white">
    <div class="container-fluid d-flex align-items-center justify-content-between py-3">
      <div>
        <div class="app-brand">WUT1 Citizen Application</div>
        <div class="text-secondary small">Business-first · Agent-assisted · Verifiable</div>
      </div>
      <nav class="d-flex gap-3">
        <a href="/master-detail">Master / Detail</a>
        <a href="/dashboard">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container-fluid py-4">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
