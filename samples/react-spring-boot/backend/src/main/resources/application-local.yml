# Local Standalone Profile
# 不需要 SQL Server / Docker；SQLite Database File 會建立於專案 data/ 目錄。

spring:
  datasource:
    url: "jdbc:sqlite:${SQLITE_DB_PATH:./data/wut1-sample.db}?foreign_keys=on&busy_timeout=5000"
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 是單檔 Database；教學環境限制單一 Connection，避免不必要的 write lock 競爭。
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 10000

  sql:
    init:
      # 只有 local profile 允許自動建立 Sample Schema / Sample Data。
      # 正式企業 Database 仍應依公司人工 DB Change 流程管理。
      mode: always
      schema-locations: classpath:db/CURRENT_SCHEMA.sql
      data-locations: classpath:db/LOCAL_SAMPLE_DATA.sql
      continue-on-error: false

logging:
  level:
    com.example.wut1sample: DEBUG
